<script>
/* ===== PENGATURAN PENCATATAN AKSES SISWA =====
   Isi LOG_URL dengan alamat Web App Google Apps Script (lihat file apps-script-log-akses.gs).
   Jika dikosongkan, login tetap berjalan tetapi tidak ada data yang dikirim ke guru. */
var LOG_URL='';
/* Kode mapel dibaca dari alamat (?mapel=koding-ai). Dipakai admin untuk memisahkan data per mapel. */
var MAPEL=(new URLSearchParams(location.search).get('mapel')||'koding-ai').slice(0,40);
var user=null;
function bacaUser(){try{return JSON.parse(sessionStorage.getItem('mp_user'))}catch(e){return null}}
function simpanUser(u){try{sessionStorage.setItem('mp_user',JSON.stringify(u))}catch(e){}}
function hapusUser(){try{sessionStorage.removeItem('mp_user')}catch(e){}}
function catat(aktivitas,detail){if(!user)return;
 /* Simpan ke Supabase (tabel siswa_media) agar tampil di admin.html */
 try{if(window.SMKBackend&&window.SMKBackend.ready){
  window.SMKBackend.insertSiswaMedia({nama:user.nama,kelas:user.kelas,nisn:user.nis,mapel:MAPEL,aktivitas:String(aktivitas).slice(0,120),detail:String(detail||'').slice(0,300)})
   .then(function(r){if(!r.ok)console.warn('Data siswa belum tersimpan:',r.message)});}}catch(e){}
 if(!LOG_URL)return;
 try{fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
  body:JSON.stringify({aktivitas:aktivitas,nama:user.nama,kelas:user.kelas,nis:user.nis,detail:detail||''})}).catch(function(){})}catch(e){}}

function tabel(rows){var t=h('table'),th=h('thead'),tb=h('tbody'),r0=h('tr');
 rows[0].forEach(function(c){r0.appendChild(h('th',{text:c,scope:'col'}))});th.appendChild(r0);
 rows.slice(1).forEach(function(r){var tr=h('tr');r.forEach(function(c){tr.appendChild(h('td',{text:c}))});tb.appendChild(tr)});
 t.appendChild(th);t.appendChild(tb);return h('div',{class:'tblw'},[t]);}
function materi(box,c){
 if(c.tp&&c.tp.length){var ul=h('ul');c.tp.forEach(function(x){ul.appendChild(h('li',{text:x}))});
  box.appendChild(h('div',{class:'tpbox'},[h('h3',{text:'Tujuan Pembelajaran'}),ul]));}
 if(c.kk&&c.kk.length){var ch=h('div',{class:'chips','aria-label':'Kata kunci'});
  c.kk.forEach(function(k){ch.appendChild(h('span',{class:'kw',text:k}))});box.appendChild(ch);}
 c.sec.forEach(function(sc){
  box.appendChild(h('h2',{class:'sech',text:sc.t}));
  var g=h('div',{class:'cgrid'});
  sc.items.forEach(function(x){
   var kids=[h('h3',{text:x[0]}),h('p',{text:x[1]})];
   if(x[2])kids.push(tabel(x[2]));
   if(x[3])kids.push(h('pre',{class:'out code',text:x[3]}));
   g.appendChild(h('div',{class:'concept'+(x[2]||x[3]?' wide':'')},kids));});
  box.appendChild(g);});}

var app=document.getElementById('app'),mp=document.getElementById('mpBtn'),mm=document.getElementById('mpMenu');
function go(id){location.hash=id}
function menuOpen(o){mm.hidden=!o;mp.setAttribute('aria-expanded',o)}
CH.forEach(function(c){var a=h('a',{href:'#'+c.id,'data-id':c.id},[h('i',{text:c.no}),h('span',{text:c.t})]);a.onclick=function(){menuOpen(false)};mm.appendChild(a)});
mp.onclick=function(e){e.stopPropagation();menuOpen(mm.hidden)};
document.addEventListener('click',function(e){if(!mm.contains(e.target))menuOpen(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){menuOpen(false);mp.focus()}});
document.getElementById('home').onclick=document.getElementById('homeNav').onclick=function(){go('beranda')};
document.getElementById('th').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme');
 var dark=d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark')};
document.getElementById('fs').onclick=function(){try{var p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){})}catch(e){}};

function home(){app.textContent='';
 app.appendChild(h('div',{class:'hero'},[h('span',{class:'chip',text:'Papan Interaktif Digital · Kelas X SMA/MA'}),
  h('h1',{text:'Koding dan Kecerdasan Artifisial'}),
  h('p',{text:'Pilih salah satu bab untuk membuka materi, aktivitas interaktif, dan kuis. Dirancang untuk layar sentuh besar di depan kelas.'})]));
 var g=h('div',{class:'grid'});
 CH.forEach(function(c){var b=h('button',{class:'card',onclick:function(){go(c.id)}},[h('span',{class:'no',text:'Bab '+c.no}),h('h3',{text:c.t}),h('p',{text:c.tag})]);g.appendChild(b)});
 app.appendChild(g);
 app.appendChild(h('p',{class:'sticky-note',text:'Sumber materi: Buku Siswa Koding dan Kecerdasan Artifisial untuk SMA/MA Kelas X, Kemendikdasmen 2025.'}));}

function quiz(box,ch){var i=0,s=0,Q=ch.quiz;
 function draw(){box.textContent='';
  if(i>=Q.length){catat('Selesai kuis Bab '+ch.no,'Skor '+s+' dari '+Q.length);box.appendChild(h('h3',{text:'Skor akhir: '+s+' dari '+Q.length}));
   box.appendChild(h('p',{text:s===Q.length?'Sempurna. Siap lanjut ke bab berikutnya.':'Baca ulang tab Materi, lalu coba lagi.'}));
   box.appendChild(h('button',{class:'btn pri',text:'Ulangi kuis',onclick:function(){i=0;s=0;draw()}}));return;}
  var q=Q[i];
  box.appendChild(h('div',{class:'meta'},[h('span',{text:'Soal '+(i+1)+' dari '+Q.length}),h('span',{text:'Skor '+s})]));
  box.appendChild(h('div',{class:'prog'},[h('i',{style:'width:'+(i/Q.length*100)+'%'})]));
  box.appendChild(h('p',{class:'q',text:q[0]}));
  var o=h('div',{class:'opts'}),fb=h('div',{class:'fb',hidden:'',role:'status'}),nx=h('button',{class:'btn pri',text:i<Q.length-1?'Soal berikutnya':'Lihat skor',hidden:'',onclick:function(){i++;draw()}});
  q[1].forEach(function(t,n){var b=h('button',{class:'opt',text:String.fromCharCode(65+n)+'. '+t,onclick:function(){
   Array.prototype.forEach.call(o.children,function(x){x.disabled=true});
   var ok=n===q[2];if(ok)s++;b.classList.add(ok?'ok':'bad');o.children[q[2]].classList.add('ok');
   fb.hidden=false;fb.textContent=(ok?'Benar. ':'Belum tepat. ')+q[3];nx.hidden=false}});o.appendChild(b)});
  box.appendChild(o);box.appendChild(fb);box.appendChild(h('div',{style:'margin-top:14px'},[nx]));}
 draw();}

var tabState={};
function chapter(c){app.textContent='';catat('Membuka Bab '+c.no,c.t);
 var tab=tabState[c.id]||0;
 app.appendChild(h('div',{class:'crumb'},[h('button',{class:'btn',text:'← Semua bab',onclick:function(){go('beranda')}}),h('span',{class:'pill',text:'Bab '+c.no})]));
 app.appendChild(h('h1',{text:c.t,style:'font-size:clamp(30px,4.5vw,48px)'}));
 app.appendChild(h('p',{text:c.intro,style:'color:var(--muted);max-width:75ch'}));
 var tabs=h('div',{class:'tabs',role:'tablist'}),panel=h('div',{class:'panel',role:'tabpanel'});
 var names=['Materi','Aktivitas','Kuis'];
 function show(n){tabState[c.id]=n;panel.textContent='';
  Array.prototype.forEach.call(tabs.children,function(b,k){b.setAttribute('aria-selected',k===n)});
  if(n===0){materi(panel,c)}
  else if(n===1){var m={klas:actKlas,sort:actSort,kartu:actKartu,pgtc:actPgtc,lisensi:actLisensi};m[c.act](panel,c)}
  else quiz(panel,c);}
 names.forEach(function(t,n){tabs.appendChild(h('button',{class:'tab',role:'tab',text:t,onclick:function(){show(n)}}))});
 app.appendChild(tabs);app.appendChild(panel);
 var nav=h('div',{class:'row',style:'margin-top:22px;justify-content:space-between'});
 var p=CH[c.no-2],nx=CH[c.no];
 nav.appendChild(p?h('button',{class:'btn',text:'← Bab '+p.no,onclick:function(){go(p.id)}}):h('span'));
 if(nx)nav.appendChild(h('button',{class:'btn pri',text:'Bab '+nx.no+' →',onclick:function(){go(nx.id)}}));
 app.appendChild(nav);show(tab);}

function route(){var id=(location.hash||'').slice(1),c=CH.filter(function(x){return x.id===id})[0];
 Array.prototype.forEach.call(mm.children,function(a){a.classList.toggle('on',a.getAttribute('data-id')===id)});
 if(c)chapter(c);else home();window.scrollTo(0,0);}
window.addEventListener('hashchange',function(){if(user)route()});
function terapkanLogin(){
 var lg=document.getElementById('login'),hd=document.querySelector('header.top');
 lg.hidden=!!user;hd.hidden=!user;app.hidden=!user;
 document.getElementById('who').hidden=document.getElementById('logout').hidden=!user;
 if(user){document.getElementById('who').textContent=user.nama+' · '+user.kelas;route()}
 else{document.getElementById('lgNama').focus()}}
document.getElementById('lgForm').onsubmit=function(e){e.preventDefault();
 var nama=document.getElementById('lgNama').value.replace(/\s+/g,' ').trim(),
  kelas=document.getElementById('lgKelas').value.replace(/\s+/g,' ').trim(),
  nis=document.getElementById('lgNis').value.trim(),err=document.getElementById('lgErr');
 if(nama.length<3){err.textContent='Isi nama lengkap (minimal 3 huruf).';return}
 if(!kelas){err.textContent='Isi kelas, misalnya X TKJ 1.';return}
 if(!/^\d{4,15}$/.test(nis)){err.textContent='NIS/NISN hanya angka (4 sampai 15 digit).';return}
 err.textContent='';user={nama:nama,kelas:kelas,nis:nis};simpanUser(user);catat('Login');terapkanLogin();};
document.getElementById('logout').onclick=function(){catat('Logout');user=null;hapusUser();
 document.getElementById('lgForm').reset();location.hash='';terapkanLogin();};
user=bacaUser();terapkanLogin();
</script>
