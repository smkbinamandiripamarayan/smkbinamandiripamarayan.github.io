<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Pembelajaran KKA</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Papan interaktif: papan tulis biru-hijau, kapur kuning sebagai penanda. Header + dropdown, kartu bab besar. */
:root{
  --bg:#eef3f5; --surface:#ffffff; --fg:#0f2128; --muted:#4a606a; --line:#c9d6db;
  --accent:#0a6a85; --accent-fg:#ffffff; --chalk:#f4b400; --chalk-fg:#2a2000;
  --ok:#0f7a3d; --okbg:#d9f2e3; --bad:#b3261e; --badbg:#fde3e1;
  --head:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c181d; --surface:#142830; --fg:#eaf3f6; --muted:#9fb8c1; --line:#2b4650;
  --accent:#4fc3e0; --accent-fg:#06222b; --chalk:#ffd23f; --chalk-fg:#2a2000;
  --ok:#6fe3a0; --okbg:#12392a; --bad:#ff8a80; --badbg:#42201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c181d; --surface:#142830; --fg:#eaf3f6; --muted:#9fb8c1; --line:#2b4650;
  --accent:#4fc3e0; --accent-fg:#06222b; --chalk:#ffd23f; --chalk-fg:#2a2000;
  --ok:#6fe3a0; --okbg:#12392a; --bad:#ff8a80; --badbg:#42201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 20px/1.55 var(--body);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--chalk);outline-offset:2px}
h1,h2,h3{font-family:var(--head);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--accent);z-index:30}
.bar{display:flex;align-items:center;gap:8px;padding-block:8px;flex-wrap:wrap}
.brand{font:700 22px var(--head);margin-right:auto;display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;padding:8px 4px;min-height:56px;text-align:left}
.brand b{background:var(--chalk);color:var(--chalk-fg);border-radius:8px;padding:2px 10px}
.nb{min-height:56px;padding:0 18px;border-radius:12px;border:2px solid transparent;background:transparent;color:inherit;font-weight:600}
.nb:hover,.nb[aria-expanded="true"]{background:rgba(255,255,255,.18)}
.nb.ico{width:56px;padding:0;font-size:24px}
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);width:min(440px,92vw);background:var(--surface);color:var(--fg);border:3px solid var(--accent);border-radius:16px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.menu a{display:flex;gap:14px;align-items:center;min-height:64px;padding:8px 12px;border-radius:12px;text-decoration:none;color:inherit;font-weight:600;line-height:1.25}
.menu a:hover,.menu a.on{background:var(--bg)}
.menu a i{font:700 24px var(--head);font-style:normal;background:var(--chalk);color:var(--chalk-fg);border-radius:10px;min-width:44px;height:44px;display:grid;place-items:center}
main{padding-block:28px 56px}
.hero{display:grid;gap:12px;margin-bottom:28px}
.hero h1{font-size:clamp(32px,5vw,54px)}
.hero p{color:var(--muted);max-width:70ch;margin:0}
.chip{display:inline-block;font:600 15px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:18px}
.card{display:grid;gap:10px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:22px;min-height:190px;align-content:start;min-width:0}
button.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .no{font:700 56px/1 var(--head);color:var(--accent)}
.card h3{font-size:26px}
.card p{margin:0;color:var(--muted);font-size:18px}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn{min-height:56px;padding:0 22px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);font-weight:600;color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn:hover{filter:brightness(1.08)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.tab{min-height:60px;padding:0 24px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:700 20px var(--head)}
.tab[aria-selected="true"]{background:var(--chalk);color:var(--chalk-fg);border-color:var(--chalk)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,32px)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.concept{border-left:8px solid var(--chalk);background:var(--bg);border-radius:12px;padding:16px 18px;min-width:0}
.concept h3{font-size:24px;margin-bottom:6px}
.concept p{margin:0;font-size:19px}
.opts{display:grid;gap:12px;margin-top:16px}
.opt{min-height:64px;text-align:left;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:14px;padding:14px 18px;border-radius:12px;background:var(--bg);border:2px dashed var(--line)}
.q{font:700 28px/1.25 var(--head)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-weight:600;margin-bottom:12px}
.prog{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bars{display:flex;gap:12px;align-items:flex-end;justify-content:center;height:260px;padding:10px;overflow-x:auto}
.bar-i{display:grid;gap:6px;justify-items:center;align-content:end;height:100%;width:72px;flex:none}
.bar-i div{width:100%;background:var(--accent);color:var(--accent-fg);border-radius:10px 10px 0 0;display:grid;place-items:start center;font:700 28px var(--head);padding-top:6px;transition:height .35s}
.bar-i.min div{background:var(--chalk);color:var(--chalk-fg)}
.bar-i.done div{background:var(--ok);color:var(--bg)}
.bar-i span{font:500 16px var(--mono);color:var(--muted)}
.flip{perspective:900px;min-height:200px}
.flip button{width:100%;min-height:200px;border:2px solid var(--line);border-radius:18px;padding:18px;background:var(--bg);text-align:left;display:grid;gap:8px;align-content:start}
.flip button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.flip h3{font-size:24px}.flip p{margin:0;font-size:18px}
.form{display:grid;gap:14px}
.form label{font:700 18px var(--head);display:grid;gap:6px}
.form input,.form textarea,.form select{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;width:100%}
.out{font:500 18px/1.6 var(--mono);white-space:pre-wrap;background:var(--bg);border:2px solid var(--accent);border-radius:14px;padding:18px;overflow-wrap:anywhere}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--chalk);color:var(--chalk-fg);font-weight:700}
.sticky-note{margin-top:18px;color:var(--muted);font-size:17px}
@media (max-width:560px){body{font-size:18px}.nb.txt{padding:0 12px}.q{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- Tambahan: materi lengkap, tabel, kode, login ---- */
[hidden]{display:none!important}
.tpbox{background:var(--bg);border:2px solid var(--line);border-left:8px solid var(--accent);border-radius:14px;padding:16px 20px;margin-bottom:18px}
.tpbox h3{font-size:24px;margin-bottom:8px}.tpbox ul{margin:0;padding-left:22px}.tpbox li{margin:4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.kw{display:inline-block;padding:4px 14px;border-radius:99px;border:2px solid var(--accent);color:var(--accent);font-weight:600;font-size:16px}
.sech{font-size:clamp(24px,3vw,32px);margin:30px 0 14px;padding-bottom:8px;border-bottom:3px solid var(--chalk)}
.concept.wide{grid-column:1/-1}
.tblw{overflow-x:auto;margin-top:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.tblw table{border-collapse:collapse;width:100%;font-size:18px}
.tblw th,.tblw td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tblw th{background:var(--accent);color:var(--accent-fg);font-family:var(--head)}
.tblw tr:last-child td{border-bottom:0}
pre.code{margin:12px 0 0;font-size:17px;line-height:1.5}
.who{color:var(--accent-fg);font-weight:600;padding:0 10px;max-width:32ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:var(--bg);overflow-y:auto}
.lg-card{width:min(520px,100%);background:var(--surface);border:3px solid var(--accent);border-radius:20px;padding:clamp(20px,4vw,34px);display:grid;gap:14px}
.lg-card h1{font-size:clamp(28px,5vw,38px)}
.lg-card p{margin:0;color:var(--muted);font-size:18px}
.lg-card label{font:700 18px var(--head);display:grid;gap:6px}
.lg-card input{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;width:100%}
.lg-err{color:var(--bad);font-weight:600;min-height:1.4em}
.lg-note{font-size:16px!important}
</style>
</head>
<body>
<header class="top"><div class="wrap bar">
  <button class="brand" id="home" aria-label="Beranda"><b>KKA</b> Koding &amp; Kecerdasan Artifisial · Kelas X</button>
  <button class="nb txt" id="homeNav">Beranda</button>
  <div class="dd">
    <button class="nb txt" id="mpBtn" aria-expanded="false" aria-haspopup="true" aria-controls="mpMenu">Media Pembelajaran ▾</button>
    <nav class="menu" id="mpMenu" hidden aria-label="Daftar bab"></nav>
  </div>
  <span class="who" id="who" hidden></span>
  <button class="nb txt" id="logout" hidden>Keluar</button>
  <button class="nb ico" id="fs" aria-label="Layar penuh" title="Layar penuh">⛶</button>
  <button class="nb ico" id="th" aria-label="Ganti tema terang/gelap" title="Tema">◐</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="login" id="login" role="dialog" aria-modal="true" aria-labelledby="lgT" hidden>
 <form class="lg-card" id="lgForm" autocomplete="off" novalidate>
  <span class="chip">Media Pembelajaran KKA · Kelas X</span>
  <h1 id="lgT">Masuk Siswa</h1>
  <p>Isi data dirimu untuk membuka materi, aktivitas, dan kuis.</p>
  <label for="lgNama">Nama lengkap<input id="lgNama" maxlength="60" placeholder="Contoh: Siti Aminah" required></label>
  <label for="lgKelas">Kelas<input id="lgKelas" maxlength="20" placeholder="Contoh: X TKJ 1" required></label>
  <label for="lgNis">NIS / NISN<input id="lgNis" inputmode="numeric" maxlength="15" placeholder="Hanya angka" required></label>
  <div class="lg-err" id="lgErr" role="alert"></div>
  <button class="btn pri" type="submit">Masuk</button>
  <p class="lg-note">Nama, kelas, dan NIS dicatat agar guru mengetahui siapa yang mengakses media pembelajaran dan hasil kuisnya.</p>
 </form>
</div>


<script>
/* Materi disusun dari Buku Siswa KKA Kelas X (Kemendikdasmen, 2025). Format item: [judul, teks, tabel, kode] */
var CH=[{"id":"bab-1","no":1,"t":"Berpikir Komputasional","tag":"Memecah masalah, mengenali pola, menyusun algoritma.","intro":"Berpikir komputasional adalah cara menyelesaikan masalah kompleks secara sistematis, sehingga solusinya dapat dijalankan manusia maupun komputer.","tp":["Menerapkan penyelesaian masalah kompleks dalam kehidupan sehari-hari dengan pendekatan berpikir komputasional."],"kk":["Masalah Kompleks","Berpikir Kritis","Berpikir Komputasional","Kecerdasan Artifisial","Analisis Masalah"],"sec":[{"t":"A. Penerapan Berpikir Komputasional dalam Penyelesaian Masalah Sehari-hari","items":[["Mengapa penting?","Dengan berpikir komputasional kamu terbiasa memecah masalah besar menjadi bagian kecil, mencari pola, memilah informasi yang benar-benar penting, lalu menyusun langkah penyelesaian yang jelas dan runtut. Keterampilan ini juga melatih berpikir efisien dan kreatif, sehingga berguna bukan hanya di dunia teknologi, tetapi juga di pendidikan, kesehatan, bisnis, dan ilmu sosial."],["Masalah kompleks","Masalah kompleks adalah masalah yang sulit diselesaikan secara langsung karena melibatkan banyak hal, terdiri atas banyak langkah, punya banyak kemungkinan solusi, atau saling berkaitan. Contoh: merancang jadwal pelajaran seluruh sekolah atau mengurangi kemacetan kota besar.",[["Masalah Sederhana","Masalah Kompleks"],["Dapat diselesaikan dengan langkah langsung.","Perlu analisis dan strategi."],["Penyebabnya jelas dan tunggal.","Penyebabnya banyak dan saling terkait."],["Solusinya dapat langsung dipraktikkan.","Solusinya perlu uji coba dan evaluasi."],["Contoh: printer tidak aktif.","Contoh: sistem pencatatan kehadiran peserta didik yang tidak efektif."]]],["Lima hal yang dilatih","1) Memahami masalah secara menyeluruh. 2) Memecah masalah besar menjadi bagian kecil. 3) Mengabaikan detail yang tidak penting dan fokus pada informasi yang relevan. 4) Mencari pola dari masalah. 5) Membuat langkah-langkah solusi yang logis dan efisien."],["Empat pilar","Dekomposisi: memecah masalah kompleks menjadi bagian-bagian kecil. Pengenalan pola: mencari kesamaan, tren, atau keteraturan. Abstraksi: fokus pada informasi penting dan mengabaikan detail yang tidak relevan. Algoritma: menyusun langkah-langkah terurut untuk menyelesaikan masalah."]]},{"t":"B. Analisis Masalah","items":[["Berpikir kritis","Berpikir kritis adalah keterampilan abad ke-21 untuk menganalisis informasi secara objektif, mengidentifikasi bias, dan membuat keputusan yang tepat. Ciri pemikir kritis: rasa ingin tahu tinggi (sering bertanya “mengapa” dan “bagaimana”) serta mampu memecah masalah dan mengenali pola, hubungan, dan implikasi informasi. Berpikir komputasional berpotensi meningkatkan keterampilan berpikir kritis."],["Metode 5 Whys","Tanyakan “kenapa” sebanyak lima kali untuk menggali akar masalah. Contoh kantin: pelayanan lambat → hanya satu petugas yang melayani → petugas lain menyiapkan makanan → tidak ada pembagian tugas yang jelas → belum ada SOP karena pengelola belum mendapat pelatihan manajemen pelayanan."],["Langkah menganalisis kasus","Contoh kasus penurunan nilai: (a) Dekomposisi: mata pelajaran apa saja yang turun. (b) Pengenalan pola: apakah turunnya setelah perubahan rutinitas. (c) Identifikasi akar masalah: penyebab utamanya. (d) Evaluasi pendekatan: apakah cara belajar masih efektif. (e) Pertimbangkan berbagai perspektif: faktor lain di luar diri sendiri."]]},{"t":"C. Simulasi Penyelesaian Masalah dengan Berpikir Komputasional","items":[["Masalah: rute tercepat ke sekolah","Pertimbangkan jarak rumah-sekolah, kondisi lalu lintas, jenis jalan, jumlah persimpangan, jam keberangkatan, dan perubahan rute mendadak (perbaikan jalan atau kecelakaan)."],["Dekomposisi dan pola","Dekomposisi: tentukan lokasi rumah, lokasi sekolah, jalan yang tersedia, serta jenis dan kondisi jalan (gunakan peta digital). Pola: jalan besar cenderung cepat tetapi sering macet, jalan kecil lebih sepi tetapi banyak tikungan, persimpangan rawan terlambat, kemacetan muncul pada jam tertentu, dan beberapa jalan banjir saat hujan."],["Abstraksi dengan graf","Sederhanakan masalah menjadi graf: node (titik) = rumah, sekolah, dan persimpangan; edge (sisi) = jalan penghubung; weight (bobot) = waktu tempuh atau jarak."],["Algoritma Dijkstra dan A*","Dijkstra mencari semua kemungkinan rute dari titik awal ke tujuan lalu menghitung yang paling pendek (waktu atau jarak). A* (A-Star) mirip Dijkstra tetapi lebih cepat karena memperkirakan arah tujuan."],["Simulasi langkah demi langkah","1) Input lokasi. 2) Kumpulkan data jalan. 3) Tentukan rute alternatif, misalnya R→A→S, R→B→C→S, R→D→E→F→S. 4) Hitung total waktu tempuh. 5) Bandingkan semua rute; jika sama, pilih yang paling stabil atau aman. 6) Tampilkan hasil."],["Contoh kasus","Jalur 1: Rumah→Jalan A→Sekolah, 12 menit. Jalur 2: Rumah→Jalan B→Sekolah, 13 menit. Jalur 3: Rumah→Jalan C→D→Sekolah, 12 menit. Jalur 1 dan 3 sama efisien, tetapi aplikasi peta kemungkinan memilih Jalur 1 karena persimpangannya lebih sedikit."]]},{"t":"D. Integrasi Kecerdasan Artifisial dalam Berpikir Komputasional","items":[["Perception (sensory)","Mengumpulkan dan memproses data dari lingkungan. Contoh: API lalu lintas (Google Maps API, Waze API), sensor IoT pada lampu lalu lintas atau CCTV, dan data cuaca dari BMKG."],["Data representation","Mengorganisasi data agar mudah diproses. Contoh: data lalu lintas sebagai graf berbobot (simpul = persimpangan, sisi = ruas jalan, bobot = waktu tempuh), data waktu sebagai time series (misalnya pukul 06.00–08.00), serta cuaca dan kecelakaan sebagai fitur tambahan."],["Reasoning","Mengambil keputusan dari data yang telah diorganisasi. Contoh: algoritma Dijkstra atau A* pada graf berbobot dinamis, rule-based reasoning (hindari rute rawan banjir saat hujan), dan probabilistic reasoning untuk memperkirakan kemacetan dari pola historis."],["Learning","Sistem meningkatkan kinerja dari data historis dan umpan balik. Contoh: machine learning berbasis reinforcement learning seperti Q-Learning, deep learning LSTM untuk memprediksi pola kemacetan dari data time series, dan memperbarui model dengan waktu tempuh aktual pengguna."],["Contoh kasus terintegrasi","Peserta didik berangkat pukul 06.30 WIB. Perception: ambil data real-time lalu lintas dan cuaca. Data representation: buat graf berbobot tiga rute alternatif. Reasoning: pilih rute dengan A*, hindari jalan rawan banjir. Learning: catat waktu tempuh aktual dan perbarui model."]]}],"act":"klas","cards":null,"quiz":[["Memecah proyek poster menjadi riset, desain, dan cetak adalah contoh…",["Abstraksi","Dekomposisi","Algoritma","Pengenalan pola"],1,"Memecah masalah besar menjadi bagian kecil disebut dekomposisi."],["Siti menyadari kemacetan selalu terjadi pada hari Senin pagi. Ini contoh…",["Abstraksi","Algoritma","Dekomposisi","Pengenalan pola"],3,"Menemukan keteraturan pada hari dan jam tertentu adalah pengenalan pola."],["Masalah yang penyebabnya banyak dan saling terkait, serta solusinya perlu uji coba dan evaluasi, disebut…",["Masalah sederhana","Masalah kompleks","Masalah teknis","Masalah tunggal"],1,"Ciri tersebut ada pada masalah kompleks."],["Metode 5 Whys bertujuan untuk…",["Mencari akar penyebab masalah","Mengurutkan data","Menggambar flowchart","Menghitung rata-rata"],0,"Pertanyaan “mengapa” yang berulang menggali penyebab utama."],["Pada graf rute ke sekolah, “bobot” sisi biasanya menyatakan…",["Nama jalan","Jumlah kendaraan saja","Waktu atau jarak tempuh","Warna peta"],2,"Bobot adalah nilai biaya suatu sisi, misalnya waktu tempuh."],["Algoritma yang mirip Dijkstra tetapi lebih cepat karena memperkirakan arah tujuan adalah…",["Binary search","A* (A-Star)","Selection sort","K-Means"],1,"A* menambahkan perkiraan arah ke tujuan."],["Mengabaikan warna meja dan seragam petugas kantin ketika menganalisis antrean adalah…",["Abstraksi","Dekomposisi","Debugging","Algoritma"],0,"Abstraksi: fokus pada informasi penting, buang detail yang tidak relevan."],["Komponen KA yang mengubah data menjadi bentuk yang dapat diproses mesin, misalnya graf berbobot, adalah…",["Perception","Data Representation","Reasoning","Learning"],1,"Data Representation menyusun data agar dapat diproses."],["Sistem memperbaiki prediksi rute dari waktu tempuh aktual pengguna setiap hari. Aspek yang dominan adalah…",["Perception","Data Representation","Reasoning","Learning"],3,"Belajar dari data historis dan umpan balik adalah Learning."]]},{"id":"bab-2","no":2,"t":"Algoritma dan Pemrograman Lanjut","tag":"Array, pencarian, pengurutan, machine learning, pemrograman teks, dan debugging.","intro":"Algoritma adalah langkah-langkah logis dan sistematis untuk menyelesaikan masalah. Pada bab ini kamu menerapkan pemrograman berbasis teks, melakukan debugging, dan membandingkan algoritma.","tp":["Menerapkan pemrograman berbasis teks.","Menerapkan debugging.","Melakukan perbandingan algoritma."],"kk":["Algoritma","Flowchart","Pemrograman","Debugging"],"sec":[{"t":"A. Algoritma Dasar","items":[["Apa itu algoritma?","Algoritma adalah langkah-langkah logis yang disusun sistematis untuk menyelesaikan masalah atau mencapai tujuan. Prinsipnya dapat diterapkan di berbagai bidang: resep masakan, prosedur perakitan, hingga pengambilan keputusan sehari-hari."],["Bentuk penyajian algoritma","Algoritma dapat disajikan sebagai uraian naratif, pseudocode, tabel Input-Proses-Output (IPO), atau flowchart. Menyajikannya dalam bentuk ini membiasakanmu berpikir langkah demi langkah sebelum menulis kode."]]},{"t":"B. Implementasi Logika Pemrograman dalam Flowchart","items":[["Logika pemrograman","Logika pemrograman adalah landasan cara kerja program: cara berpikir terstruktur untuk mengolah data, mengambil keputusan, dan menjalankan perintah. Logika tidak bergantung pada sintaks satu bahasa (C++, Pascal, Java, Python). Algoritma adalah urutan langkah yang mewujudkan penyelesaian masalah tersebut."],["Logika urutan (sequence)","Instruksi dijalankan berurutan dari atas ke bawah tanpa percabangan atau pengulangan. Contoh: menghitung rata-rata nilai.",null,"1. Mulai\n2. Terima nilai-nilai dari user\n3. Jumlahkan semua nilai\n4. Bagi total dengan jumlah nilai\n5. Tampilkan rata-rata\n6. Selesai"],["Logika seleksi (percabangan)","Membuat keputusan berdasarkan kondisi dengan struktur if, if-else, atau switch-case. Contoh: menentukan kelulusan.",null,"1. Mulai\n2. Masukkan nilai peserta didik\n3. Jika nilai >= 60 → \"Lulus\"\n4. Jika tidak → \"Tidak Lulus\"\n5. Tampilkan hasil\n6. Selesai"],["Logika perulangan (looping)","Mengeksekusi blok kode berulang selama kondisi terpenuhi. Struktur yang digunakan: For, While do, dan Repeat Until. Contoh: mencetak angka 1 sampai 10.",null,"1. Mulai\n2. counter = 1\n3. Selama counter <= 10: cetak counter, tambahkan 1\n4. Ulangi sampai counter lebih dari 10\n5. Selesai"]]},{"t":"C. Algoritma Terstruktur dan Penerapannya","items":[["Array","Array menyimpan sekumpulan nilai bertipe sama dalam satu variabel. Setiap nilai disebut elemen dan punya indeks unik yang dimulai dari 0. Kamus “A : array of Integer” berarti setiap elemen A bernilai integer.",null,"A = [10, 2, 30, 4]\nA[0] = 10\nA[1] = 2\nJumlah = A[1] + A[3]   // 2 + 4 = 6"],["Nested if","Satu pernyataan if di dalam blok if atau else lainnya, untuk keputusan bertingkat yang bergantung pada keputusan sebelumnya.",null,"if nilai >= 90 then predikat = \"A\"\nelse if nilai >= 75 then predikat = \"B\"\nelse if nilai >= 60 then predikat = \"C\"\nelse predikat = \"D\""],["Nested loop","Satu loop di dalam loop lain. Setiap kali loop luar berjalan sekali, loop dalam berjalan penuh. Dipakai untuk mencetak pola, tabel, atau mengakses array multidimensi.",null,"for i = 1 to 3 do\n  for j = 1 to 5 do\n    Hasil = i * j\n    Output(Hasil)\n  endfor\nendfor"],["Sequential search","Sequential (linear) search memeriksa elemen satu per satu dari indeks pertama sampai terakhir. Jika sampai akhir tidak ditemukan, hasilnya “tidak ditemukan”. Data tidak perlu terurut."],["Binary search","Binary search mencari posisi nilai pada array yang sudah terurut dengan membagi array menjadi dua secara berulang dan membandingkan dengan elemen tengah. Jika nilai lebih kecil dari tengah, cari di kiri; jika lebih besar, cari di kanan.",[["Aspek","Sequential Search","Binary Search"],["Cara kerja","Memeriksa elemen satu per satu dari awal","Membagi array dan mencari di bagian tengah"],["Syarat data","Tidak perlu terurut","Harus diurutkan terlebih dahulu"],["Jumlah perbandingan","Sebanyak jumlah elemen (100 data = 100 kali)","Jauh lebih sedikit"],["Loop maksimal","Sebanyak jumlah elemen","Untuk 100 data, cukup 7 kali"]]],["Selection sort","Memilih elemen terkecil (atau terbesar) dari data yang belum terurut, lalu menukarnya dengan elemen di posisi awal; diulang untuk bagian yang tersisa. Contoh [6, 3, 8, 5, 2] → [2, 3, 8, 5, 6] → [2, 3, 8, 5, 6] → [2, 3, 5, 8, 6] → [2, 3, 5, 6, 8]."],["Insertion sort","Bekerja seperti menyusun kartu di tangan: tiap elemen disisipkan ke posisi yang tepat pada bagian yang sudah terurut. Contoh [5, 2, 4, 6, 1] → [2, 5, 4, 6, 1] → [2, 4, 5, 6, 1] → [2, 4, 5, 6, 1] → [1, 2, 4, 5, 6].",[["Aspek","Selection Sort","Insertion Sort"],["Metode","Memilih elemen terkecil lalu menukarnya","Menyisipkan elemen ke posisi yang tepat"],["Cara kerja","Seleksi elemen terkecil dan tukar ke depan","Bandingkan ke belakang, geser, dan sisipkan"],["Jumlah pertukaran","Lebih sedikit","Lebih banyak karena sering menggeser elemen"]]],["Machine learning: Decision Tree","Struktur berbentuk pohon untuk membantu keputusan atau prediksi. Root node adalah pertanyaan pertama, decision node adalah pertanyaan lanjutan, dan leaf node adalah hasil akhir."],["Machine learning: Regresi Linear","Memprediksi nilai Y (dependen) dari variabel X (independen) yang memiliki hubungan sebab akibat. a adalah konstanta (intercept), b adalah kemiringan garis (slope). Contoh tinggi 150–170 cm dan berat 45–60 kg: rata-rata X = 160, rata-rata Y = 52,4; b = 175 ÷ 250 = 0,7; a = 52,4 − 0,7 × 160 = −59,6. Prediksi berat untuk tinggi 175 cm = 62,9 kg.",null,"b = Σ(x − x̄)(y − ȳ) / Σ(x − x̄)²\na = ȳ − b·x̄\ny = a + b·x"],["Machine learning: K-Means Clustering","Mengelompokkan data menjadi K klaster berdasarkan kemiripan; sentroid adalah pusat klaster. Langkah: 1) tentukan jumlah klaster, 2) pilih sentroid awal secara acak, 3) hitung jarak tiap data ke sentroid, 4) tentukan klaster terdekat, 5) hitung sentroid baru, 6) jika sentroid berubah ulangi dari langkah 3, jika tidak berhenti. Jarak titik A(1,2) ke B(4,6) dengan Pythagoras adalah 5."],["Machine learning: Naive Bayes","Algoritma prediksi atau klasifikasi berdasarkan teorema Bayes. Langkah: 1) kumpulkan data, 2) hitung probabilitas awal (prior), 3) hitung probabilitas bersyarat, 4) gunakan rumus Naive Bayes untuk data baru, 5) kelas dengan probabilitas tertinggi menjadi hasil prediksi."]]},{"t":"D. Pengenalan Pemrograman Teks","items":[["Pemrograman tekstual","Instruksi ditulis manual sebagai teks mengikuti sintaks bahasa tertentu (C, C++, Pascal, Python, Java). Kode ditulis di editor teks, lalu diterjemahkan compiler menjadi bahasa mesin. Alur: Source Code → Compiler → Execute → Output. Compiler juga memeriksa kesalahan sintaks."],["Tekstual vs visual","Ciri pemrograman tekstual: kode diketik manual, perlu memahami sintaks dan logika, lebih fleksibel untuk program kompleks.",[["Aspek","Tekstual","Visual"],["Cara membuat","Menulis kode manual","Menyusun blok/elemen grafis"],["Sintaks","Harus dipahami dengan benar","Tidak perlu menulis sintaks"],["Kemudahan belajar","Perlu pemahaman mendalam","Lebih mudah, cocok untuk pemula"],["Fleksibilitas","Sangat fleksibel","Terbatas fitur editor"],["Contoh","C, C++, Python, Java, JavaScript, PHP","Scratch, Blockly, MIT App Inventor"]]],["Tool tanpa instalasi","Google Colab adalah aplikasi cloud Google untuk menulis dan menjalankan kode, terutama Python. OnlineGDB adalah compiler dan debugger online yang mendukung C, C++, Java, dan Python, dengan hasil langsung terlihat."]]},{"t":"E. Sintaks Dasar Pemrograman","items":[["Bahasa C","Bahasa prosedural untuk pengembangan sistem. Aturan: kode logika berada dalam fungsi main(); komentar memakai // atau /* ... */; setiap pernyataan diakhiri titik koma (;); nama variabel tanpa spasi dan tidak diawali angka (gunakan underscore); bersifat case-sensitive.",null,"#include <stdio.h>\nint main() {\n  printf(\"Halo, dunia!\\n\");\n  return 0;\n}"],["Bahasa Python","Bahasa tingkat tinggi dengan sintaks sederhana. Tidak perlu fungsi main(), komentar memakai #, titik koma tidak wajib, dan bersifat case-sensitive. Konversi tipe data memakai int(), float(), dan str().",null,"nama = input(\"Masukkan nama: \")\nprint(\"Halo,\", nama)\na = \"123\"\nprint(int(a))"],["Bahasa Java","Bahasa berorientasi objek yang dapat berjalan di banyak platform. Semua kode ada dalam kelas, nama berkas harus sama dengan nama kelas, perlu fungsi main(), dan bersifat case-sensitive.",null,"public class Halo {\n  public static void main(String[] args) {\n    System.out.println(\"Halo, dunia!\");\n  }\n}"]]},{"t":"F. Analisis Kesalahan (Debugging) dalam Kode Program","items":[["Apa itu debugging?","Debugging adalah proses mencari, menemukan, dan memperbaiki kesalahan (bug) agar program berjalan sebagaimana mestinya. Bug sangat umum, bahkan programer berpengalaman pun mengalaminya."],["Syntax error","Kode tidak sesuai aturan penulisan bahasa; compiler atau interpreter menolak menjalankan program. Contoh: tanda titik koma hilang di Java, “pint” alih-alih “print” di Python, atau memakai print() di C yang seharusnya printf()."],["Logic error","Program berjalan tanpa eror tetapi hasilnya tidak sesuai harapan, dan tidak terdeteksi compiler. Contoh: seharusnya penjumlahan tetapi ditulis hasil = a - b."],["Runtime error","Kesalahan yang muncul saat program dijalankan. Contoh: pembagian dengan nol (Division by zero) di C, atau TypeError saat menjumlahkan string dan integer di Python."],["Langkah debugging","a) Baca pesan eror (menunjukkan letak dan jenis kesalahan). b) Tambahkan output sementara (print debugging). c) Gunakan debugger tools dengan breakpoint. d) Periksa kode dengan saksama. Contoh: nilai = input(...) selalu string, ubah menjadi int(input(...))."]]}],"act":"sort","cards":null,"quiz":[["Indeks pertama sebuah array adalah…",["0","1","−1","Tergantung isi"],0,"Indeks array dimulai dari 0."],["Syarat wajib binary search adalah data…",["Berupa teks","Sudah terurut","Berjumlah genap","Unik semua"],1,"Binary search hanya bekerja pada data yang sudah terurut."],["Nilai 82 mendapat predikat berikut menurut contoh nested if…",["A","B","C","D"],1,"B untuk nilai ≥ 75 dan < 90."],["Jika loop luar berjalan sekali, loop dalam pada nested loop akan…",["Berhenti","Berjalan penuh","Berjalan sekali","Dilewati"],1,"Loop dalam berjalan sepenuhnya untuk setiap iterasi loop luar."],["Pada selection sort [6, 3, 8, 5, 2], langkah pertama menukar 6 dengan…",["3","8","5","2"],3,"Nilai terkecil (2) ditukar ke posisi pertama."],["Pada regresi linear contoh buku, prediksi berat badan untuk tinggi 175 cm adalah…",["52,4 kg","59,6 kg","62,9 kg","70 kg"],2,"y = −59,6 + 0,7 × 175 = 62,9 kg."],["K-Means digunakan untuk…",["Mengurutkan data","Mengelompokkan data berdasarkan kemiripan","Mencari akar masalah","Menerjemahkan kode"],1,"K-Means membentuk K klaster dengan sentroid."],["Urutan proses pemrograman tekstual yang benar adalah…",["Execute → Compiler → Source → Output","Source Code → Compiler → Execute → Output","Compiler → Source → Output → Execute","Output → Source → Compiler → Execute"],1,"Kode ditulis, dikompilasi, dijalankan, lalu menghasilkan output."],["Program berjalan tetapi hasilnya salah. Jenis kesalahannya…",["Syntax error","Logic error","Runtime error","Compile error"],1,"Logic error: sintaks benar, tetapi logikanya keliru."],["Pembagian dengan angka nol saat program dijalankan menyebabkan…",["Syntax error","Logic error","Runtime error","Tidak ada masalah"],2,"Division by zero adalah runtime error."],["Komentar satu baris pada Python ditulis dengan tanda…",["//","#","/* */","--"],1,"Python memakai # untuk komentar."]]},{"id":"bab-3","no":3,"t":"Literasi dan Etika Kecerdasan Artifisial","tag":"Pengenalan pola, profesi, keterampilan, dampak, serta regulasi dan etika KA.","intro":"Memahami KA tidak cukup dari sisi teknis. Kita juga perlu mengenal profesinya, dampaknya, serta aturan dan etika penggunaannya.","tp":["Memahami cara pengenalan pola citra dan suara oleh KA.","Mengenali profesi di bidang KA.","Memahami konsekuensi pemanfaatan KA.","Memahami regulasi dan etika penggunaan KA."],"kk":["Literasi KA","Pengenalan Pola Citra dan Suara","Profesi di Bidang KA","Dampak KA","Regulasi dan Etika"],"sec":[{"t":"A. Pengenalan Pola Citra dan Suara","items":[["Pengenalan pola citra","Bidang KA yang berfokus pada kemampuan komputer menganalisis dan memahami informasi visual dari gambar digital: bentuk, warna, tekstur, dan hubungan spasial antarpiksel. Penerapannya: deteksi objek, pengenalan wajah, klasifikasi citra, analisis citra medis (sinar X, MRI, CT scan), pengenalan tulisan tangan, dan inspeksi kualitas industri."],["Pengenalan pola suara","Bidang KA yang memungkinkan komputer menganalisis data audio melalui pola akustik seperti frekuensi, amplitudo, dan perubahan temporal. Penerapannya: asisten virtual (Siri, Google Assistant, Alexa), transkripsi otomatis (ASR), pengenalan pembicara, analisis emosi dalam suara, deteksi suara lingkungan, dan kontrol perangkat dengan suara."],["Peran data","Komputer “belajar” mengenali pola dari banyak contoh data latih, misalnya jutaan gambar dari permainan Quick, Draw! Semakin banyak dan beragam datanya, semakin baik KA mengenali pola."]]},{"t":"B. Profesi di Bidang Kecerdasan Artifisial","items":[["Perubahan dunia kerja","KA mengubah dunia kerja dengan cepat: ada pekerjaan yang mungkin hilang, ada yang berubah, dan ada yang lahir baru. Di balik aplikasi pengenal wajah, chatbot, atau mobil tanpa pengemudi ada tim ahli yang merancang, membangun, dan memastikan teknologi itu berguna, aman, dan adil."],["Data Scientist","Mengumpulkan, menganalisis, dan menafsirkan data untuk membangun model KA yang efektif. Analogi pembangunan rumah: arsitek sekaligus detektif yang mencari pola tersembunyi pada data."],["Machine Learning Engineer","Merancang dan mengimplementasikan algoritma pembelajaran mesin agar sistem KA belajar dari data dan meningkat seiring waktu. Perlu keahlian matematika, statistik, dan koding. Analogi: jika KA adalah peserta didik, ML engineer menciptakan kurikulum dan metode belajarnya."],["AI Research Scientist","“Ilmuwan” yang menemukan cara baru agar KA lebih pintar: meneliti dan mengembangkan algoritma serta model mutakhir, termasuk deep learning dan reinforcement learning. Pada reinforcement learning, KA belajar coba-coba dengan reward saat benar dan penalty saat salah."],["Robotics Engineer","Menggabungkan KA dengan teknik dan mekanika untuk membuat robot yang berinteraksi dengan lingkungan fisik. Perannya: memberi “otak” pada robot, merancang sistem robot pintar (mekanis, elektronika, perangkat lunak), dan berinovasi pada otomatisasi di pabrik, rumah sakit, gudang, hingga luar angkasa."],["AI Ethics Specialist","Memastikan pengembangan dan penggunaan KA etis, adil, dan bertanggung jawab. Tugas utama: analisis etis dan sosial, perumusan kebijakan dan pedoman etika, audit dan evaluasi sistem KA, kolaborasi multidisipliner, edukasi dan kesadaran publik, serta pemantauan regulasi dan standar global."]]},{"t":"C. Keterampilan yang Dibutuhkan dan Perspektif Karier dalam KA","items":[["Standar ACM/IEEE-CS/AAAI","Kurikulum internasional untuk komputer, KA, dan etika teknologi dengan fokus: matematika dan statistik; pemrograman dan rekayasa perangkat lunak; KA dan machine learning (deep learning, RL); etika dan profesionalisme; competency model; serta pendekatan metodologis (pembelajaran aktif, proyek, inklusi)."],["Kerangka kompetensi UNESCO (2024)","12 kompetensi dalam empat dimensi, berkembang melalui tiga tingkat kemahiran: understand (memahami), apply (mengaplikasi), dan create (mencipta). Empat dimensi: Human-Centred Mindset, Ethics of AI, AI Techniques and Applications, dan AI System Design."],["Tujuh keterampilan umum","1) Dasar matematika dan logika. 2) Pemrograman. 3) Data dan analisis data. 4) Machine learning dan deep learning. 5) Kreativitas. 6) Problem solving (critical thinking). 7) Etika dan human centered thinking."]]},{"t":"D. Dampak Pemanfaatan Kecerdasan Artifisial","items":[["Dampak positif","Produktivitas dan efisiensi: otomatisasi tugas rutin, optimalisasi proses, analisis data cepat. Inovasi: kesehatan (membaca rontgen/MRI, menemukan obat), pendidikan (belajar adaptif, deteksi plagiarisme), transportasi (mobil tanpa sopir, rute tercepat), keamanan siber, dan energi (penghematan listrik). Personalisasi layanan: belanja daring, media sosial, dan aplikasi belajar."],["Dampak negatif","Hilangnya pekerjaan rutin; kesenjangan ekonomi; ketergantungan berlebihan pada teknologi (menurunkan berpikir kritis); risiko keamanan data dan privasi; bias dan diskriminasi algoritma; hilangnya interaksi sosial; kurangnya akuntabilitas; dan ancaman militer otonom."],["Mengapa perlu etika dan regulasi?","Mencegah penyalahgunaan dan bahaya; menghindari bias dan diskriminasi; melindungi privasi; serta menegakkan akuntabilitas dan tanggung jawab. Regulasi dan etika berfungsi sebagai “rambu-rambu” agar KA berkembang aman, adil, dan bermanfaat."],["Regulasi global","UNESCO merilis Rekomendasi Etika KA 2021 yang disepakati 193 negara (KA berpusat pada manusia, inklusif, berlandaskan hak asasi). Uni Eropa menyusun AI Act yang mengatur KA berdasarkan tingkat risiko (pengenalan wajah diatur lebih ketat). Amerika Serikat mengeluarkan executive order KA yang aman dan tepercaya, dan Tiongkok menerbitkan pedoman yang menekankan keamanan dan etika. PBB mendorong kerangka kesepakatan digital global."],["Regulasi di Indonesia","Strategi Nasional Kecerdasan Artifisial 2020–2045 menjadi peta jalan KA yang menempatkan etika sesuai nilai Pancasila. Kominfo menerbitkan Surat Edaran Nomor 9 Tahun 2023 tentang Etika KA dengan enam nilai: inklusivitas, aksesibilitas, keamanan dan privasi, kemanusiaan, kredibilitas, dan akuntabilitas."]]}],"act":"kartu","cards":[["Data Scientist","Menganalisis data besar untuk menemukan wawasan dan mendukung keputusan."],["Machine Learning Engineer","Merancang dan melatih model pembelajaran mesin agar siap dipakai."],["AI Research Scientist","Meneliti dan mengembangkan metode baru di bidang KA."],["Robotics Engineer","Membangun robot yang memadukan perangkat keras dan KA."],["AI Ethics Specialist","Memastikan KA adil, aman, dan bertanggung jawab."],["Inklusivitas","Nilai SE Kominfo: KA dapat digunakan semua orang dan memberi manfaat luas."],["Aksesibilitas","Nilai SE Kominfo: KA mudah diakses, bukan “barang mewah” bagi sebagian kecil orang."],["Keamanan dan Privasi","Nilai SE Kominfo: data pribadi pengguna dilindungi, seperti kunci rumah."],["Kemanusiaan","Nilai SE Kominfo: KA berpihak pada manusia; keputusan penting tidak diserahkan penuh ke KA."],["Kredibilitas","Nilai SE Kominfo: konten buatan KA sebaiknya diberi tanda agar tidak menipu."],["Akuntabilitas","Nilai SE Kominfo: pengembang dan pengguna siap bertanggung jawab jika ada masalah."]],"quiz":[["Aplikasi mengenali wajah dari foto adalah contoh…",["Pengenalan pola citra","Basis data relasi","Spreadsheet","Compiler"],0,"Mengenali wajah memanfaatkan pola pada citra."],["Mengubah ucapan menjadi teks tertulis disebut…",["Face recognition","Automatic Speech Recognition","Klasifikasi citra","Deteksi objek"],1,"ASR mengubah ucapan menjadi teks."],["Siapa yang berfokus memastikan KA adil dan bertanggung jawab?",["Data Scientist","Robotics Engineer","AI Ethics Specialist","ML Engineer"],2,"AI Ethics Specialist menjaga aspek etika KA."],["Profesi yang merancang “cara belajar” bagi KA adalah…",["Machine Learning Engineer","Robotics Engineer","Data Scientist","AI Ethics Specialist"],0,"ML engineer membuat algoritma agar KA belajar dari data."],["Pada reinforcement learning, KA belajar melalui…",["Hafalan","Reward dan penalty","Salinan data","Wawancara"],1,"KA mencoba tindakan, diberi reward bila benar dan penalty bila salah."],["UNESCO merumuskan kompetensi KA dalam berapa dimensi?",["2","4","6","12"],1,"12 kompetensi dalam 4 dimensi."],["Sistem rekrutmen KA cenderung memilih laki-laki karena data lama didominasi laki-laki. Ini contoh…",["Efisiensi","Bias dan diskriminasi algoritma","Personalisasi","Akuntabilitas"],1,"Data latih bias menghasilkan keputusan diskriminatif."],["Rekomendasi Etika KA UNESCO 2021 disepakati oleh berapa negara?",["50","100","193","250"],2,"Disepakati oleh 193 negara, termasuk Indonesia."],["SE Kominfo No. 9 Tahun 2023 memuat berapa nilai etika KA?",["3","4","6","12"],2,"Enam nilai: inklusivitas, aksesibilitas, keamanan dan privasi, kemanusiaan, kredibilitas, akuntabilitas."],["Dokter tetap yang memutuskan pengobatan, bukan KA. Nilai etika yang dijaga adalah…",["Kemanusiaan","Aksesibilitas","Inklusivitas","Kredibilitas"],0,"Keputusan penting tidak boleh diserahkan penuh pada KA."]]},{"id":"bab-4","no":4,"t":"Integrasi Prompt Engineering dan Design Thinking pada KA","tag":"Menyusun prompt yang efektif, memahami bias KA, dan merancang solusi berpusat pada manusia.","intro":"Prompt yang baik menghasilkan jawaban KA yang tepat. Design thinking membantu kita merancang solusi yang benar-benar dibutuhkan pengguna.","tp":["Menyusun prompt yang efektif untuk model bahasa besar (LLM).","Memahami cara kerja KA dalam menghasilkan konten.","Mengenali bias pada KA.","Merancang sistem KA dengan design thinking."],"kk":["Prompt Engineering","LLM","Bias KA","Design Thinking"],"sec":[{"t":"A. Prompt Engineering","items":[["LLM","Large language model adalah model KA yang dilatih dengan data teks sangat besar sehingga mengenali pola, struktur, dan makna bahasa. LLM memprediksi kata selanjutnya dari pola yang dipelajari; ia tidak memahami seperti manusia dan tidak tahu maksud pengguna secara langsung, sehingga kualitas input menentukan output."],["Prompt, prompting, dan prompt engineering","Prompt adalah instruksi, pertanyaan, atau permintaan kepada KA. Prompting adalah tindakan memberikan prompt (bisa sekali atau berulang seperti percakapan). Prompt engineering adalah teknik atau seni merancang instruksi agar output paling sesuai, akurat, dan relevan, termasuk pemilihan kata, struktur kalimat, dan urutan informasi."],["Pendekatan berdasarkan jumlah contoh","Zero-shot: instruksi tanpa contoh, model mengandalkan pengetahuan sebelumnya (semakin spesifik, semakin relevan). One-shot: disertai satu contoh. Few-shot: disertai beberapa contoh input-output agar pola jawaban jelas."],["Pendekatan berdasarkan teknik penyusunan","Direct prompt: instruksi langsung dan spesifik. Role-playing prompt: memberi peran atau skenario (“Kamu adalah ahli fisika…”). Inverse prompt: output sudah diketahui, lalu menyusun prompt yang mungkin menghasilkannya. Contextual prompt: memberi konteks atau latar sebelum tugas. Multi-turn prompt: percakapan beberapa giliran, konteks sebelumnya dipakai untuk jawaban berikutnya. Kedua pendekatan dapat dikombinasikan."],["Tujuh teknik dasar prompt","1) Spesifik dan jelas. 2) Beri konteks dan peran (role prompting). 3) Gunakan pertanyaan terbuka. 4) Pahami tools yang digunakan. 5) Tentukan format jawaban (daftar, tabel, paragraf). 6) Berikan contoh. 7) Gunakan kerangka PGTC."],["Kerangka PGTC","Persona: peran yang dimainkan KA. Goal: tujuan akhir permintaan. Task: tugas spesifik yang diminta. Context: latar belakang atau situasi.",null,"Persona : Kamu adalah guru biologi SMA.\nGoal    : Materi dipakai untuk pembelajaran daring.\nTask    : Buatkan penjelasan singkat dan soal latihan sistem pernapasan.\nContext : Untuk peserta didik kelas 11."]]},{"t":"B. Cara Kerja KA dalam Menghasilkan Konten","items":[["Empat tahap","1) Pengumpulan dan prapemrosesan data: data dari artikel, buku, situs web, dan dialog dibersihkan dan dikategorikan. 2) Pelatihan model dengan machine learning: KA belajar dari data lalu mengenali pola, membuat prediksi, dan mengambil keputusan, misalnya menebak buah merah dan kecil sebagai apel. 3) Foundation model dan LLM: bersifat generatif, mampu membuat teks baru. 4) Pembuatan konten baru berdasarkan input (prompt) secara real-time."]]},{"t":"C. Bias Kecerdasan Artifisial","items":[["Pengertian bias KA","Kecenderungan atau ketidakseimbangan output KA akibat data pelatihan, desain model, atau proses pengembangan yang tidak netral atau representatif. KA belajar dari data yang bisa mengandung prasangka, stereotip, atau ketidakseimbangan."],["Contoh bias","Pengenalan wajah untuk absensi sering salah mengenali siswa berkacamata karena data latih kurang beragam. Media sosial mengotak-kotakkan rekomendasi konten berdasarkan jenis kelamin. Aplikasi belajar memberi soal yang tidak sesuai kurikulum daerah karena data latih berasal dari sekolah unggulan."],["Bias dataset","Bias representasi (data tidak beragam secara proporsional), bias sampling (pengambilan sampel tidak acak), bias label (label dipengaruhi prasangka), bias historis (data mewarisi ketidakadilan masa lalu), dan bias omisi (informasi penting tidak dimasukkan)."],["Bias algoritma dan bias pengguna","Bias algoritma: algoritma tidak netral, pemilihan fitur yang bias (misalnya “daerah tertinggal”), atau algoritma memperkuat pola bias dalam data. Bias pengguna: KA belajar dari preferensi pengguna yang subjektif, atau pengguna membingkai pertanyaan dengan asumsi tertentu (framing bias)."]]},{"t":"D. Perancangan Sistem KA dengan Design Thinking","items":[["Design thinking","Pendekatan pemecahan masalah yang berpusat pada manusia (human-centered), mengintegrasikan kebutuhan pengguna, kemungkinan teknologi, dan keuntungan bisnis; dilakukan berulang."],["Lima elemen","Human-centered (fokus pada manusia), creative and playful (suasana terbuka dan menyenangkan), iterative (uji dan ulangi sampai tepat), collaborative (kerja sama lintas disiplin), dan prototype driven (uji solusi dengan prototipe atau mind map)."],["Lima tahapan","Empathize: berempati dan memahami kebutuhan pengguna (contoh: mewawancarai teman yang kesulitan matematika). Define: merumuskan masalah dari hasil empati. Ideate: menghasilkan sebanyak mungkin ide kreatif. Prototype: membuat representasi sederhana solusi. Test: menguji prototipe dan menyempurnakannya."]]},{"t":"E. Merancang Sistem KA dengan Design Thinking","items":[["Perancangan sistem","Menjembatani gagasan dari tahap ideate menjadi sesuatu yang dapat diuji lewat prototipe. Sistem dapat berupa digital (aplikasi, animasi, simulasi), fisik (permainan papan, alat peraga), atau prosedural (alur layanan). Rancangan harus sederhana, terstruktur, mudah diuji, dan relevan bagi pengguna."],["Contoh: pengelompokan warna (clustering)","Empathize: observasi dan wawancara tentang kesulitan membedakan warna. Define: “Banyak orang kesulitan mengelompokkan atau memilih kombinasi warna yang tepat.” Ideate: program pemindai warna atau permainan edukatif. Prototype: alur Mulai → ambil/unggah gambar → preview → masukkan ke kelompok warna → simpan → selesai, beserta desain antarmuka. Test: minta teman menguji alur dan antarmuka."]]}],"act":"pgtc","cards":null,"quiz":[["LLM menghasilkan teks dengan cara…",["Mencari jawaban di buku catatan","Memprediksi kata selanjutnya berdasarkan pola data latih","Menelepon pengguna","Menyalin halaman web utuh"],1,"LLM memprediksi kata berikutnya dari pola yang dipelajari."],["Prompt tanpa contoh disebut…",["Zero-shot","One-shot","Few-shot","Inverse"],0,"Zero-shot tidak menyertakan contoh."],["Prompt yang memberi beberapa contoh disebut…",["Zero-shot","One-shot","Few-shot","Inverse"],2,"Few-shot menyertakan beberapa contoh."],["“Kamu adalah ahli fisika. Jelaskan hukum Newton pertama.” adalah contoh…",["Direct prompt","Role-playing prompt","Inverse prompt","Multi-turn prompt"],1,"Memberi peran kepada KA adalah role-playing prompt."],["Huruf P pada PGTC adalah…",["Prompt","Persona","Program","Pola"],1,"Persona, Goal, Task, Context."],["Menyusun prompt dari output yang sudah diketahui disebut…",["Contextual prompt","Direct prompt","Inverse prompt","Zero-shot prompt"],2,"Inverse prompt memulai dari output."],["KA mengenali wajah berkacamata dengan buruk karena data latih kurang beragam. Ini bias…",["Dataset","Algoritma","Pengguna","Perangkat"],0,"Bias dataset muncul dari data yang tidak representatif."],["Pengguna membingkai pertanyaan dengan asumsi tertentu sehingga jawaban KA terpengaruh. Ini…",["Bias sampling","Framing bias (bias pengguna)","Bias historis","Bias omisi"],1,"Framing bias termasuk bias pengguna."],["Tahap pertama design thinking adalah…",["Define","Ideate","Empathize","Test"],2,"Empathize: memahami perasaan dan kebutuhan pengguna."],["Urutan lima tahap design thinking yang benar adalah…",["Define, Empathize, Ideate, Test, Prototype","Empathize, Define, Ideate, Prototype, Test","Ideate, Empathize, Define, Prototype, Test","Empathize, Ideate, Define, Test, Prototype"],1,"Empathize → Define → Ideate → Prototype → Test."]]},{"id":"bab-5","no":5,"t":"Kreativitas dan Etika Produksi Konten Media Sosial","tag":"Multimedia, hak cipta, lisensi Creative Commons, etika, pembuatan konten, dan keamanan digital.","intro":"Membuat konten kreatif berarti juga menghormati karya orang lain, menjaga privasi, dan bertanggung jawab atas jejak digital.","tp":["Memahami konsep multimedia dan elemen-elemennya.","Memahami hak cipta, lisensi digital, dan etika produksi konten.","Membuat konten digital dengan aplikasi desain/video.","Menerapkan keamanan digital dalam berbagi konten."],"kk":["Multimedia","Hak Cipta","Lisensi Digital","Etika Konten","Keamanan Digital"],"sec":[{"t":"A. Konsep Multimedia","items":[["Pengertian multimedia","“Multi” berarti banyak dan “media” berarti perantara. Multimedia adalah gabungan teks, gambar, grafik, suara, animasi, dan video yang dimanipulasi secara digital serta sering bersifat interaktif."],["Elemen multimedia","Teks: memberi informasi dan menjelaskan (contoh: subtitle). Gambar: foto, ilustrasi, atau grafik yang membantu memahami informasi. Audio: musik, narasi, dan efek suara. Video: gambar bergerak dan bersuara. Animasi: kumpulan grafik yang memberi ilusi gerak dengan bantuan komputer."]]},{"t":"B. Hak Cipta dan Lisensi Digital","items":[["Hak cipta","Menurut UU No. 28 Tahun 2014 tentang Hak Cipta, hak cipta adalah hak eksklusif pencipta yang timbul secara otomatis berdasarkan prinsip deklaratif setelah ciptaan diwujudkan dalam bentuk nyata."],["Ciptaan yang dilindungi","Buku, program komputer, pamflet, dan karya tulis; ceramah, pidato; alat peraga pendidikan; lagu atau musik; drama, tari, koreografi, pewayangan; seni rupa; arsitektur; peta; seni batik; fotografi; serta terjemahan, tafsir, dan saduran."],["Cara menghormati hak cipta","Gunakan materi buatan sendiri atau yang sudah mendapat izin; cari konten berlisensi Creative Commons; selalu beri kredit kepada pencipta; jangan mengubah atau mendistribusikan karya orang lain tanpa izin. Untuk melindungi karya sendiri, daftarkan hak cipta atau gunakan lisensi Creative Commons."],["Jenis lisensi","Lisensi eksklusif: hak penggunaan hanya untuk satu pihak. Lisensi noneksklusif: hak penggunaan diberikan kepada lebih dari satu pihak. Creative Commons (CC): lisensi yang memungkinkan pencipta mengatur akses dan penggunaan karyanya oleh publik."],["Enam lisensi Creative Commons","CC BY (Atribusi): boleh dipakai dan diubah, bahkan komersial, asal menyebut pencipta. CC BY-SA: sama dengan BY, tetapi hasil ubahan memakai lisensi yang sama. CC BY-ND: boleh dibagikan, tidak boleh diubah. CC BY-NC: boleh diubah, hanya nonkomersial. CC BY-NC-SA: nonkomersial dan hasil ubahan berlisensi sama. CC BY-NC-ND: paling ketat, hanya dibagikan tanpa diubah dan tidak komersial.",[["Lisensi","Boleh diubah?","Komersial?","Syarat tambahan"],["CC BY","Ya","Ya","Sebut pencipta"],["CC BY-SA","Ya","Ya","Lisensi sama"],["CC BY-ND","Tidak","Ya","Sebut pencipta"],["CC BY-NC","Ya","Tidak","Sebut pencipta"],["CC BY-NC-SA","Ya","Tidak","Lisensi sama"],["CC BY-NC-ND","Tidak","Tidak","Paling ketat"]]]]},{"t":"C. Etika Produksi Konten","items":[["Pentingnya etika","Etika adalah “kompas moral” di dunia digital: menghormati karya orang lain, tidak menyinggung atau merugikan orang lain, mencantumkan sumber dengan benar, serta tidak menyebarkan hoaks, kebohongan, atau data pribadi tanpa izin."],["Contoh pelanggaran etika","Plagiarisme atau pelanggaran hak cipta (memakai gambar, video, musik tanpa izin atau sumber); pelanggaran privasi (merekam dan menyebarkan orang lain tanpa izin); cyberbullying (konten untuk menghina atau mengejek); dan disinformasi (mengedit informasi atau gambar untuk menipu)."]]},{"t":"D. Proses Pembuatan Konten Digital","items":[["Konten digital dan aplikasinya","Konten digital adalah semua informasi dalam format digital yang dapat diakses lewat perangkat elektronik: artikel, video, gambar, dan musik. Aplikasi yang dapat dipakai: CapCut, Kinemaster, InShot, Adobe Premiere, dan Canva. Buku memakai Canva; Canva Pro tersedia pada akun belajar.id untuk konten nonkomersial."],["Alur membuat video di Canva","Memulai video → memasukkan elemen video (unggah dari fail atau pilih elemen) → elemen teks (menambah dan menyunting) → elemen gambar → elemen audio (termasuk AI Voice) → elemen animasi → bagikan, unduh, atau publikasikan. Menu pada Canva versi ponsel tampilannya berbeda dari komputer."]]},{"t":"E. Teknik Keamanan Digital dalam Berbagi Konten","items":[["Melindungi konten digital","Tambahkan watermark (nama atau logo kecil sebagai tanda kepemilikan); gunakan pengaturan privasi platform; simpan salinan asli sebagai bukti; hindari mengunggah data pribadi (KTP, alamat rumah); dan cantumkan keterangan lisensi seperti Creative Commons."],["Berbagi konten dengan aman","Pastikan penerima tepat; gunakan format yang tepat (PDF untuk dokumen penting); kelola akses tautan (hindari “Publik untuk semua orang”, pilih “Hanya orang dengan link” atau orang tertentu); jangan bagikan informasi pribadi seperti alamat, nomor telepon, nama orang tua, atau NISN."],["Cek sebelum membagikan","Tanyakan: “Apakah ini aman untuk dibagikan?”, “Apakah ini menyakiti atau mempermalukan orang lain?”, dan “Apakah konten ini dapat disalahartikan?”. Ingat, setiap unggahan meninggalkan jejak digital yang sulit dihapus."]]}],"act":"lisensi","cards":null,"quiz":[["Lima elemen multimedia adalah…",["Teks, gambar, audio, video, animasi","Teks, tabel, kode, grafik, sensor","Gambar, suhu, cahaya, suara, tekstur","Teks, rumus, peta, kode, file"],0,"Teks, gambar, audio, video, dan animasi."],["Undang-undang hak cipta di Indonesia adalah UU No. …",["11 Tahun 2008","28 Tahun 2014","27 Tahun 2022","19 Tahun 2016"],1,"UU No. 28 Tahun 2014 tentang Hak Cipta."],["Hak cipta timbul secara otomatis setelah ciptaan…",["Didaftarkan ke pengadilan","Diwujudkan dalam bentuk nyata","Dijual","Diunggah ke internet"],1,"Prinsip deklaratif: lahir saat ciptaan diwujudkan nyata."],["Karya boleh dibagikan ulang dan diubah, tetapi tidak untuk komersial. Lisensi…",["CC BY","CC BY-NC","CC BY-ND","CC BY-SA"],1,"NC berarti NonCommercial."],["Lisensi Creative Commons yang paling ketat adalah…",["CC BY","CC BY-SA","CC BY-NC-ND","CC BY-NC"],2,"Hanya boleh dibagikan tanpa diubah dan tidak komersial."],["Mengaku karya orang lain sebagai karya sendiri disebut…",["Remix","Plagiarisme","Parodi","Kurasi"],1,"Itu plagiarisme."],["Merekam orang lain lalu menyebarkannya tanpa izin termasuk…",["Pelanggaran privasi","Kolaborasi","Animasi","Kurasi"],0,"Itu pelanggaran privasi."],["Menyebar kabar palsu yang disengaja termasuk…",["Disinformasi","Kolaborasi","Animasi","Enkripsi"],0,"Disinformasi adalah informasi salah yang sengaja disebarkan."],["Tanda nama atau logo kecil pada konten sebagai tanda kepemilikan disebut…",["Watermark","Template","Filter","Caption"],0,"Watermark menandai pemilik karya."],["Pengaturan berbagi dokumen di cloud yang lebih aman adalah…",["Publik untuk semua orang","Hanya orang dengan link atau orang tertentu","Tanpa kata sandi","Dibagikan ke semua kontak"],1,"Batasi akses agar tidak disalahgunakan."]]},{"id":"bab-6","no":6,"t":"Pengelolaan Informasi Digital","tag":"Dari data menjadi kebijaksanaan: basis data, SQL, dan pengolahan data dengan spreadsheet.","intro":"Data yang dikelola dengan baik berubah menjadi informasi, pengetahuan, dan akhirnya kebijaksanaan untuk mengambil keputusan.","tp":["Memahami data, informasi, dan basis data.","Mengenali jenis basis data dan konsep basis data relasi.","Memahami dasar server lokal dan SQL.","Mengolah data dasar menggunakan spreadsheet."],"kk":["Data","Informasi","Basis Data","SQL","Spreadsheet"],"sec":[{"t":"A. Pengenalan Basis Data","items":[["Data","Data adalah kumpulan fakta mentah yang belum memiliki arti atau konteks. Analogi sayur sop: wortel dan kentang adalah data, sayur sop matang adalah informasi."],["Klasifikasi data","Berdasarkan sumber: primer (dikumpulkan langsung) dan sekunder (dari pihak lain). Berdasarkan bentuk: numerik, tekstual, visual, audio. Berdasarkan struktur: terstruktur (tabel) dan tidak terstruktur (audio, video, teks panjang). Berdasarkan sifat: kualitatif (kategori, skala nominal/ordinal) dan kuantitatif (angka, skala interval/rasio)."],["Informasi","Informasi adalah data yang telah diolah sehingga bermakna dan berguna untuk keputusan. Fungsinya: mendukung pengambilan keputusan, media komunikasi dan penyebaran pengetahuan, serta alat kontrol dan evaluasi. Informasi berkualitas itu akurat, relevan, tepat waktu, dan lengkap."],["Piramida DIKW","Data → Informasi → Pengetahuan (Knowledge) → Kebijaksanaan (Wisdom). Contoh: suhu harian (data), suhu rata-rata kelas (informasi), pola siang selalu panas (pengetahuan), keputusan memasang kipas dan mengatur ventilasi (kebijaksanaan)."],["Basis data dan DBMS","Basis data (database) adalah kumpulan data terorganisir yang tersimpan di komputer. DBMS adalah perangkat lunak untuk mengatur penyimpanan, memelihara, dan mengontrol akses data agar integritas dan keamanannya terjamin. Manfaat: hemat waktu dan biaya, konsistensi data, menghindari duplikasi, mudah diakses dan diperbarui, aman, serta mudah diintegrasikan."],["Peran dalam lingkungan basis data","Administrator basis data: menjaga keamanan data dan mengatur hak akses. Desainer basis data: merancang tabel dan struktur data. Pengembang aplikasi: membuat aplikasi yang berinteraksi dengan basis data. Pengguna (end-user): memakai aplikasi untuk mencari atau memasukkan informasi."]]},{"t":"B. Jenis-Jenis Basis Data","items":[["Empat jenis","Basis data relasi: data berbentuk tabel (baris dan kolom) yang saling terhubung. NoSQL: fleksibel tanpa struktur tabel kaku, cocok untuk dokumen atau objek. Berbasis cloud: disimpan di internet dan dapat diakses dari mana saja. Terdistribusi: tersebar di beberapa lokasi tetapi bekerja sebagai satu kesatuan."],["Teknologi pendukung terdistribusi","Replikasi (menyalin data antarserver), mirroring (salinan real-time), data warehouse dan data mart (analisis), serta big data (volume data sangat besar). Aplikasi media sosial jutaan pengguna cocok dengan NoSQL, sedangkan sistem keuangan yang butuh konsistensi tinggi cocok dengan basis data relasional."]]},{"t":"C. Basis Data Relasi","items":[["Entitas dan atribut","Entitas adalah satuan berwujud yang unik, bisa konkret (buku, guru, peserta didik) atau peran (pelanggan, pengguna). Atribut adalah sifat atau detail entitas dan menjadi kolom tabel (contoh: NIS, nama, alamat)."],["Jenis atribut","Atribut kunci (membedakan setiap record: primary key dan foreign key), atribut sederhana (tidak dapat dipecah, misalnya nama), atribut komposit (dapat dipecah, misalnya alamat), multivalue (lebih dari satu nilai, misalnya beberapa nomor telepon), dan atribut turunan (dihitung dari atribut lain, misalnya usia dari tahun lahir)."],["Tipe data","Numerik (angka), teks/string (termasuk kode pos), tanggal/waktu, dan boolean (benar/salah, sering 1/0). Pilih tipe yang tepat agar penyimpanan efisien dan data dapat diolah dengan benar."],["Tabel, record, dan field","Tabel menyimpan entitas. Baris disebut record, kolom disebut atribut atau field."],["Relasi dan kardinalitas","Relasi menggambarkan hubungan logis antarentitas (mengajar, meminjam, terdaftar pada). Kardinalitas menggambarkan jumlah maksimum keterhubungan: One to One (satu kartu anggota per peserta didik), One to Many (satu peserta didik meminjam banyak buku), dan Many to Many (peserta didik dan modul pembelajaran di LMS). Relasi dan kardinalitas mengurangi redundansi data."],["Primary key dan foreign key","Primary key membedakan setiap record secara unik (contoh: NIS). Foreign key menghubungkan tabel transaksi ke tabel referensi. Tabel referensi menyimpan data induk yang tetap (peserta didik, guru, buku); tabel transaksi menyimpan aktivitas (peminjaman, kehadiran)."]]},{"t":"D. Sekilas tentang SQL dan Server Lokal","items":[["Server lokal","Server lokal ibarat “dapur pribadi” di komputer: memungkinkan aplikasi web dikembangkan, diuji, dan dijalankan secara offline. Contoh: Apache HTTP Server (dalam paket XAMPP, WAMP, MAMP; cocok untuk PHP dan WordPress), Nginx (ringan dan efisien untuk banyak koneksi), dan Node.js (server dibuat sendiri dengan kode JavaScript, misalnya Express)."],["SQL","SQL (Structured Query Language) adalah bahasa standar untuk mengelola data pada basis data relasional: menampilkan, menambah, memperbarui, dan menghapus data."],["DML, DDL, DCL","DML (data manipulation language): insert, update, delete. DDL (data definition language): create table, alter table, drop table. DCL (data control language): grant dan revoke untuk mengatur hak akses."],["Operasi dasar SQL","Untuk pemula, gunakan phpMyAdmin (membutuhkan server lokal) yang tetap memungkinkan menulis perintah SQL. Perintah CREATE DATABASE termasuk DDL.",null,"CREATE DATABASE nama_basisdata;"]]},{"t":"E. Pengolahan Data Dasar","items":[["Spreadsheet","Untuk data skala kecil hingga menengah, spreadsheet (Microsoft Excel, Google Sheets, LibreOffice Calc) lebih mudah digunakan karena antarmukanya berupa tabel baris dan kolom yang mirip basis data relasional dan dapat langsung dilihat serta disunting."],["Fungsi dan grafik dasar","Fungsi dasar seperti AVERAGE (rata-rata), MAX, MIN, dan COUNTIF (menghitung sel sesuai kriteria, misalnya jumlah peserta didik yang lulus berdasarkan KKTP), serta pembuatan grafik batang (bar chart) atau kolom (column chart) untuk memudahkan membaca informasi dari data."]]}],"act":"kartu","cards":[["Data","Fakta mentah. Contoh: 31, 29, 33."],["Informasi","Data yang sudah diolah. Contoh: suhu rata-rata kelas 31 °C."],["Pengetahuan","Informasi yang dipahami polanya. Contoh: siang hari ruang kelas selalu lebih panas."],["Kebijaksanaan","Pengetahuan yang dipakai mengambil keputusan. Contoh: pasang kipas dan atur jadwal ventilasi."],["DML","insert, update, delete: mengolah data di dalam tabel."],["DDL","create table, alter table, drop table: mengatur struktur basis data."],["DCL","grant dan revoke: mengatur hak akses ke data."]],"quiz":[["Fakta mentah yang belum punya arti atau konteks disebut…",["Informasi","Data","Pengetahuan","Kebijaksanaan"],1,"Data adalah fakta mentah."],["Urutan piramida DIKW dari bawah ke atas adalah…",["Wisdom, Knowledge, Information, Data","Data, Information, Knowledge, Wisdom","Information, Data, Wisdom, Knowledge","Knowledge, Data, Information, Wisdom"],1,"Data → Information → Knowledge → Wisdom."],["Hasil survei yang dikumpulkan langsung dari sumber pertama adalah data…",["Sekunder","Primer","Tidak terstruktur","Kualitatif"],1,"Data primer dikumpulkan langsung."],["Rekaman audio dan video termasuk data…",["Terstruktur","Tidak terstruktur","Numerik","Primer"],1,"Tidak cocok disimpan dalam format tabel."],["Perangkat lunak untuk mengelola basis data disebut…",["DBMS","HTML","Compiler","Browser"],0,"DBMS (database management system)."],["Kolom yang mengidentifikasi setiap baris secara unik adalah…",["Foreign key","Primary key","Atribut","Field"],1,"Primary key bersifat unik."],["Alamat yang dapat dipecah menjadi jalan, RT, RW, dan kecamatan adalah atribut…",["Sederhana","Komposit","Turunan","Multivalue"],1,"Atribut komposit dapat dipecah menjadi bagian lain."],["Satu guru mengajar banyak kelas. Kardinalitasnya…",["1-1","1-N","N-N","0-0"],1,"Satu ke banyak: 1-N."],["Perintah SQL untuk menambah data baru adalah…",["SELECT","UPDATE","INSERT","CREATE"],2,"INSERT menambah record (DML)."],["CREATE TABLE termasuk kelompok perintah…",["DML","DDL","DCL","DQL"],1,"DDL mengatur struktur basis data."],["Server lokal yang cocok dipakai untuk PHP dan WordPress, serta ada dalam paket XAMPP, adalah…",["Apache","Node.js","Photoshop","Canva"],0,"Apache HTTP Server."],["Fungsi spreadsheet untuk menghitung sel yang memenuhi syarat adalah…",["AVERAGE","MAX","COUNTIF","MIN"],2,"COUNTIF menghitung sel sesuai kriteria."]]}];
</script>
<script>
function h(tag,attrs,kids){var e=document.createElement(tag);attrs=attrs||{};
  for(var k in attrs){if(k==='text')e.textContent=attrs[k];else if(k.slice(0,2)==='on')e[k]=attrs[k];else e.setAttribute(k,attrs[k]);}
  (kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e;}

/* Aktivitas 1: klasifikasi pilar (Bab 1) */
var KLAS=[
 ['Membagi tugas lomba kebersihan menjadi: sapu, pel, buang sampah, rapikan meja.',0],
 ['Menyadari bahwa tiap Senin jalan menuju sekolah selalu macet pukul 06.45.',1],
 ['Pada peta rute, hanya menggambar titik rumah, sekolah, dan waktu tempuh tanpa gambar pohon.',2],
 ['Menulis langkah membuat teh: 1) rebus air, 2) seduh, 3) saring, 4) sajikan.',3],
 ['Memecah aplikasi absensi menjadi fitur login, daftar siswa, dan laporan.',0],
 ['Mengamati bahwa nilai ulangan naik setiap kali belajar kelompok.',1]];
var PIL=['Dekomposisi','Pengenalan Pola','Abstraksi','Algoritma'];
function actKlas(box){var i=0,s=0;
 function draw(){box.textContent='';
  if(i>=KLAS.length){box.appendChild(h('h3',{text:'Selesai: skor '+s+' dari '+KLAS.length}));
   box.appendChild(h('button',{class:'btn pri',text:'Ulangi',onclick:function(){i=0;s=0;draw()}}));return;}
  box.appendChild(h('div',{class:'meta'},[h('span',{text:'Pilar manakah ini?'}),h('span',{text:(i+1)+' / '+KLAS.length})]));
  box.appendChild(h('p',{class:'q',text:KLAS[i][0]}));
  var o=h('div',{class:'opts'}),fb=h('div',{class:'fb',hidden:'',role:'status'});
  PIL.forEach(function(p,n){var b=h('button',{class:'opt',text:p,onclick:function(){
    Array.prototype.forEach.call(o.children,function(x){x.disabled=true});
    var ok=n===KLAS[i][1];if(ok)s++;b.classList.add(ok?'ok':'bad');
    if(!ok)o.children[KLAS[i][1]].classList.add('ok');
    fb.hidden=false;fb.textContent=ok?'Tepat!':'Jawaban yang benar: '+PIL[KLAS[i][1]]+'.';
    nx.hidden=false;}});o.appendChild(b)});
  var nx=h('button',{class:'btn pri',text:'Lanjut',hidden:'',onclick:function(){i++;draw()}});
  box.appendChild(o);box.appendChild(fb);box.appendChild(h('div',{class:'row',style:'margin-top:14px'},[nx]));}
 draw();}

/* Aktivitas 2: selection sort bertahap (Bab 2) */
function actSort(box){var A0=[6,3,8,5,2],a,i,j,min,phase,log;
 function reset(){a=A0.slice();i=0;j=1;min=0;phase=0;log='Array awal: ['+a.join(', ')+']. Tekan "Langkah berikutnya".';draw()}
 function step(){
  if(i>=a.length-1){return}
  if(j<a.length){ if(a[j]<a[min]){min=j;log='Membandingkan indeks '+j+': '+a[j]+' lebih kecil, minimum baru = '+a[j]+'.'}
   else log='Membandingkan indeks '+j+': '+a[j]+' tidak lebih kecil dari '+a[min]+'.'; j++;}
  else{ if(min!==i){var t=a[i];a[i]=a[min];a[min]=t;log='Tukar indeks '+i+' dengan indeks '+min+'. Posisi '+i+' sekarang terurut.'}
   else log='Minimum sudah di posisi '+i+'. Tidak perlu menukar.';
   i++;min=i;j=i+1; if(i>=a.length-1)log+=' Selesai: ['+a.join(', ')+'].';}
  draw();}
 function draw(){box.textContent='';
  box.appendChild(h('p',{text:'Selection sort pada [6, 3, 8, 5, 2], contoh dari buku. Biru kuning = elemen yang sedang menjadi minimum, hijau = sudah terurut.'}));
  var bars=h('div',{class:'bars'});
  a.forEach(function(v,n){var c='bar-i'+(n<i||i>=a.length-1?' done':n===min?' min':'');
   bars.appendChild(h('div',{class:c},[h('div',{style:'height:'+(v*28)+'px',text:v}),h('span',{text:'idx '+n})]))});
  box.appendChild(bars);
  box.appendChild(h('div',{class:'fb',role:'status',text:log}));
  box.appendChild(h('div',{class:'row',style:'margin-top:14px'},[
   h('button',{class:'btn pri',text:'Langkah berikutnya',onclick:step}),
   h('button',{class:'btn',text:'Ulangi',onclick:reset})]));}
 reset();}

/* Aktivitas 3: kartu ketuk (Bab 3, 6) */
function actKartu(box,ch){box.appendChild(h('p',{text:'Ketuk kartu untuk melihat penjelasannya.'}));
 var g=h('div',{class:'cgrid'});
 ch.cards.forEach(function(c){var d=h('div',{class:'flip'}),b=h('button',{'aria-pressed':'false'},[h('h3',{text:c[0]}),h('p',{text:'Ketuk untuk membuka',style:'color:inherit;opacity:.7'})]);
  b.onclick=function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.lastChild.textContent=on?c[1]:'Ketuk untuk membuka'};
  d.appendChild(b);g.appendChild(d)});box.appendChild(g);}

/* Aktivitas 4: pembuat prompt PGTC (Bab 4) */
function actPgtc(box){
 var F=[['Persona','Kamu adalah guru informatika SMA yang sabar.'],['Goal','Siswa kelas X memahami konsep array.'],['Task','Jelaskan array dengan 3 contoh sederhana dan 2 soal latihan.'],['Context','Siswa baru belajar Python dan belum mengenal perulangan.']];
 var inp={},out=h('div',{class:'out',role:'status'});
 function upd(){out.textContent=F.map(function(f){return f[0]+': '+(inp[f[0]].value.trim()||'(belum diisi)')}).join('\n')}
 var form=h('div',{class:'form'});
 F.forEach(function(f){var t=h('textarea',{rows:'2'});t.value=f[1];t.oninput=upd;inp[f[0]]=t;form.appendChild(h('label',{text:f[0]+' — '+({Persona:'siapa peran KA?',Goal:'apa tujuan akhirnya?',Task:'apa yang harus dikerjakan?',Context:'apa latar belakangnya?'})[f[0]]},[t]))});
 box.appendChild(h('p',{text:'Susun prompt dengan kerangka PGTC. Ubah isian dan lihat hasil prompt di bawah.'}));
 box.appendChild(form);box.appendChild(h('h3',{text:'Prompt hasil',style:'margin:18px 0 10px'}));box.appendChild(out);
 var cp=h('button',{class:'btn',text:'Salin prompt',style:'margin-top:12px',onclick:function(){
  try{navigator.clipboard.writeText(out.textContent).then(function(){cp.textContent='Tersalin'},function(){cp.textContent='Gagal menyalin'})}catch(e){cp.textContent='Gagal menyalin'}}});
 box.appendChild(cp);upd();}

/* Aktivitas 5: pemilih lisensi Creative Commons (Bab 5) */
function actLisensi(box){
 var s1=h('select',{},[h('option',{value:'y',text:'Ya, boleh diubah/diadaptasi'}),h('option',{value:'sa',text:'Boleh, asal hasilnya berlisensi sama'}),h('option',{value:'n',text:'Tidak boleh diubah'})]);
 var s2=h('select',{},[h('option',{value:'y',text:'Ya, boleh untuk tujuan komersial'}),h('option',{value:'n',text:'Tidak, nonkomersial saja'})]);
 var out=h('div',{class:'out',role:'status'});
 function upd(){var c=s1.value,n=s2.value,code='CC BY'+(n==='n'?'-NC':'')+(c==='sa'?'-SA':c==='n'?'-ND':'');
  var d={'CC BY':'Bebas dipakai dan diubah, wajib mencantumkan pembuat.','CC BY-SA':'Boleh diubah dan komersial, hasilnya wajib berlisensi sama.','CC BY-ND':'Boleh dibagikan utuh, tidak boleh diubah.','CC BY-NC':'Boleh diubah, tidak untuk komersial.','CC BY-NC-SA':'Tidak komersial, hasil adaptasi berlisensi sama.','CC BY-NC-ND':'Paling ketat: tidak komersial dan tidak boleh diubah.'};
  out.textContent=code+'\n'+d[code]}
 s1.onchange=s2.onchange=upd;
 box.appendChild(h('p',{text:'Kamu pencipta karya. Pilih izin yang kamu berikan, lalu lihat lisensi Creative Commons yang cocok. Pencantuman nama pembuat (BY) selalu wajib.'}));
 box.appendChild(h('div',{class:'form'},[h('label',{text:'Apakah karya boleh diubah?'},[s1]),h('label',{text:'Apakah boleh dipakai komersial?'},[s2])]));
 box.appendChild(h('h3',{text:'Lisensi yang cocok',style:'margin:18px 0 10px'}));box.appendChild(out);upd();}
</script>
